# ============================================================================
# Java coding agent + presenter UI - the only process that talks to a model.
# It has no filesystem access to the workspace; every action goes through MCP.
# ============================================================================
quarkus.http.host=127.0.0.1
quarkus.http.port=8090

# ---- inference: there is NO default endpoint and NO default model ------------------
# Select a profile with -Dquarkus.profile=local | enterprise | scripted (scripts/start.sh does this).
# Running without a profile fails at startup on purpose.
blueprint.model.profile=${BLUEPRINT_MODEL_PROFILE:}

# local: loopback endpoint only (Ollama, llama.cpp server, vLLM on this machine)
%local.blueprint.model.profile=local
%local.blueprint.model.base-url=${BLUEPRINT_MODEL_BASE_URL:http://127.0.0.1:11434/v1}
%local.blueprint.model.name=${BLUEPRINT_MODEL_NAME}
# Optional system-prompt prefix, e.g. "/no_think" for hybrid Qwen3 models (ignored by thinking-only builds).
%local.blueprint.model.system-prefix=${BLUEPRINT_MODEL_SYSTEM_PREFIX:}

# enterprise-private: an explicitly approved, HTTPS, OpenAI-compatible gateway
%enterprise.blueprint.model.profile=enterprise
%enterprise.blueprint.model.base-url=${BLUEPRINT_MODEL_BASE_URL}
%enterprise.blueprint.model.name=${BLUEPRINT_MODEL_NAME}
%enterprise.blueprint.model.approved-hosts=${BLUEPRINT_MODEL_APPROVED_HOSTS}
%enterprise.blueprint.model.system-prefix=${BLUEPRINT_MODEL_SYSTEM_PREFIX:}
%enterprise.blueprint.model.use-system-proxy=${BLUEPRINT_MODEL_USE_SYSTEM_PROXY:false}

# scripted: deterministic fallback, no inference, always labelled as such
%scripted.blueprint.model.profile=scripted

# Credential comes from the environment only; never put it in this file.
blueprint.model.api-key=${BLUEPRINT_MODEL_API_KEY:}
blueprint.model.timeout=${BLUEPRINT_MODEL_TIMEOUT:120s}
blueprint.model.temperature=0

# ---- MCP server ----
blueprint.mcp.url=${BLUEPRINT_MCP_URL:http://127.0.0.1:8091/mcp}
blueprint.mcp.agent-token=${BLUEPRINT_AGENT_TOKEN}
blueprint.mcp.approver-token=${BLUEPRINT_APPROVER_TOKEN}

# ---- explicit tool set (anything else is never offered to the model) ----
blueprint.allowed-tools=list_files,search_text,read_file,show_diff,propose_patch,apply_patch,run_verification

# ---- execution limits per request ----
blueprint.limits.max-steps=10
blueprint.limits.max-tool-calls=12
blueprint.limits.max-tool-output-chars=8000
blueprint.limits.max-run-time=240s
blueprint.limits.max-input-chars=4000
blueprint.limits.max-answer-chars=4000
blueprint.limits.max-history-messages=40

# ---- leakage inspection of user-provided context ----
blueprint.leakage.mode=${BLUEPRINT_LEAKAGE_MODE:REDACT}
blueprint.leakage.canaries=JFOKUS-CANARY-7f3a9c2e-DO-NOT-SHARE
blueprint.leakage.restricted-marker=AGENT-RESTRICTED

# ---- logging: no prompts, responses or authorization headers ----
quarkus.log.category."dev.langchain4j".level=WARN
quarkus.log.category."io.quarkus.http.access-log".level=OFF

# ---- tests: deterministic scripted model unless a test overrides it ----
%test.quarkus.http.port=8093
%test.blueprint.model.profile=scripted
%test.blueprint.mcp.url=http://127.0.0.1:65530/mcp
%test.blueprint.mcp.agent-token=test-agent-token
%test.blueprint.mcp.approver-token=test-approver-token

version: 2
updates:
  # ── Maven / Quarkus platform BOM + all extensions ──────────────────────────
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    # Group Quarkus platform bumps into a single PR
    groups:
      quarkus-platform:
        patterns:
          - "io.quarkus.platform:*"
          - "io.quarkus:*"
      test-dependencies:
        patterns:
          - "io.quarkus:quarkus-junit*"
          - "io.rest-assured:*"
    labels:
      - "dependencies"
      - "quarkus"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"


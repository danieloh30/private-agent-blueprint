name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build and test
        run: ./mvnw verify
      - name: Check terminal promotion uses the server gate
        run: python3 -m unittest discover -s scripts/tests

  restricted-verification:
    runs-on: ubuntu-latest
    env:
      BLUEPRINT_SANDBOX_ENGINE: docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: Prepare the pristine fixture and offline dependencies
        run: scripts/prepare-deps.sh
      - name: Require real container acceptance tests
        run: ./mvnw -B -pl mcp-server -am test -Dsandbox.it=true
      - name: Reject a missing or skipped container suite
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          report = Path('mcp-server/target/surefire-reports/TEST-io.agentcon.blueprint.mcp.SandboxContainerTest.xml')
          suite = ET.parse(report).getroot()
          assert int(suite.get('tests', '0')) > 0, 'No real container test ran'
          assert all(int(suite.get(k, '0')) == 0 for k in ('skipped', 'failures', 'errors')), suite.attrib
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restricted-verification-reports
          path: mcp-server/target/surefire-reports/

# ============================================================================
# Java MCP server - the only process that touches the workspace.
# It never talks to a model. Bind to loopback only.
# ============================================================================
quarkus.http.host=127.0.0.1
quarkus.http.port=8091
quarkus.mcp.server.server-info.name=arcade-workspace-tools
quarkus.mcp.server.server-info.version=1.0.0
# Streamable HTTP transport at /mcp (SSE transport not needed)
quarkus.mcp.server.http.root-path=/mcp
# Never log MCP traffic (it may contain source code)
quarkus.mcp.server.traffic-logging.enabled=false

# ---- locations (trusted; resolved relative to the repository root by the start scripts) ----
blueprint.state-dir=${BLUEPRINT_STATE_DIR:../.demo}
blueprint.fixture-dir=${BLUEPRINT_FIXTURE_DIR:../arcade}
blueprint.acceptance-dir=${BLUEPRINT_ACCEPTANCE_DIR:../acceptance}

# ---- authentication (values come from the environment; scripts/start.sh generates them) ----
blueprint.security.agent-token=${BLUEPRINT_AGENT_TOKEN}
blueprint.security.approver-token=${BLUEPRINT_APPROVER_TOKEN}
blueprint.security.agent-identity=demo-agent

# ---- policy (paths relative to the workspace root) ----
blueprint.policy.read-allow=src/**,docs/**,pom.xml,README.md
blueprint.policy.write-allow=src/main/java/**,src/test/java/**,src/main/resources/templates/**
blueprint.policy.protected-paths=config/**,.env,**/.env,**/*.pem,**/*.key,**/*.p12,**/*.jks,.git/**,.mvn/**,mvnw,mvnw.cmd,**/secrets/**,**/*secret*

# ---- limits ----
blueprint.limits.max-read-bytes=65536
blueprint.limits.max-output-chars=12000
blueprint.limits.max-search-hits=40
blueprint.limits.max-listed-files=200

# ---- data-leakage inspection of tool output (REDACT or BLOCK) ----
blueprint.leakage.mode=${BLUEPRINT_LEAKAGE_MODE:REDACT}
blueprint.leakage.canaries=JFOKUS-CANARY-7f3a9c2e-DO-NOT-SHARE
blueprint.leakage.restricted-marker=AGENT-RESTRICTED

# ---- approvals ----
blueprint.approval.proposal-ttl=15m
blueprint.approval.approval-ttl=5m

# ---- restricted verification sandbox ----
blueprint.sandbox.engine=${BLUEPRINT_SANDBOX_ENGINE:podman}
blueprint.sandbox.image=${BLUEPRINT_SANDBOX_IMAGE:docker.io/library/maven:3.9-eclipse-temurin-25}
blueprint.sandbox.m2-dir=${BLUEPRINT_M2_DIR:../.demo/m2}
blueprint.sandbox.memory=2g
blueprint.sandbox.cpus=2
blueprint.sandbox.pids-limit=512
blueprint.sandbox.timeout=240s

# Audit goes to .demo/runs/<run>/audit.jsonl; console gets one line per decision.
quarkus.log.category."blueprint.audit".level=INFO

# ---- test profile: fixed synthetic tokens, isolated state under target/ ----
%test.quarkus.http.port=8092
%test.blueprint.state-dir=target/test-demo
%test.blueprint.security.agent-token=test-agent-token
%test.blueprint.security.approver-token=test-approver-token
%test.blueprint.sandbox.timeout=300s
